apiVersion: v1
kind: Pod
metadata:
  name: scheduler-monitor
  namespace: scheduler-monitoring
  labels:
    app: scheduler-monitor
spec:
  containers:
  - name: monitor
    image: alpine:latest
    command:
    - sh
    - -c
    - |
      apk add --no-cache curl
      echo "Enhanced Multi-Criteria Scheduler Monitor"
      echo "========================================"
      while true; do
        echo ""
        echo "$(date): Monitoring scheduler decisions..."
        echo "Check scheduler logs for algorithm selection and performance metrics"
        sleep 60
      done
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
  restartPolicy: Never