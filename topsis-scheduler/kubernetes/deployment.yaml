apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-scheduler
  namespace: scheduler-system
  labels:
    app: enhanced-scheduler
    component: scheduler
spec:
  replicas: 1  # Single instance to avoid conflicts
  selector:
    matchLabels:
      app: enhanced-scheduler
  template:
    metadata:
      labels:
        app: enhanced-scheduler
        component: scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: enhanced-scheduler
      containers:
      - name: enhanced-scheduler
        image: enhanced-scheduler:latest
        imagePullPolicy: Never  # Use local image for development
        command:
        - java
        - -jar
        - /app/enhanced-scheduler.jar
        env:
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SCHEDULER_NAME
          value: "enhanced-scheduler"
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
        - name: LOG_LEVEL
          value: "INFO"
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "ps aux | grep '[j]ava.*enhanced-scheduler' || exit 1"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "ps aux | grep '[j]ava.*enhanced-scheduler' || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/scheduler
          readOnly: true
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: config
        configMap:
          name: enhanced-scheduler-config
      - name: logs
        emptyDir: {}
      # Ensure scheduler runs on control-plane node if needed
      tolerations:
      - operator: Exists
      # Node affinity (optional - for control plane scheduling)
      # affinity:
      #   nodeAffinity:
      #     preferredDuringSchedulingIgnoredDuringExecution:
      #     - weight: 100
      #       preference:
      #         matchExpressions:
      #         - key: node-role.kubernetes.io/control-plane
      #           operator: Exists
      restartPolicy: Always
