apiVersion: v1
kind: ServiceAccount
metadata:
  name: enhanced-scheduler
  namespace: scheduler-system
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: enhanced-scheduler
rules:
# Pod permissions - core scheduling functionality
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Pod binding - essential for pod scheduling
- apiGroups: [""]
  resources: ["pods/binding"]
  verbs: ["create"]

# Pod status - update pod status during scheduling
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["update", "patch"]

# Node permissions - read node information for scheduling decisions
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]

# Events - create scheduling events for debugging/monitoring
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch", "update"]

# ConfigMaps - read scheduler configuration
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]

# Secrets - access scheduler secrets if needed
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]

# PersistentVolumes and PersistentVolumeClaims - for volume scheduling
- apiGroups: [""]
  resources: ["persistentvolumes", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]

# Services and Endpoints - for service affinity scheduling
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch"]

# ReplicationControllers - for scheduling decisions
- apiGroups: [""]
  resources: ["replicationcontrollers"]
  verbs: ["get", "list", "watch"]

# Apps API group permissions
- apiGroups: ["apps"]
  resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]

# Extensions API group
- apiGroups: ["extensions"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]

# Policy API group - for pod disruption budgets
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch"]

# Storage API group - for storage classes and volume attachments
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses", "volumeattachments", "csinodes"]
  verbs: ["get", "list", "watch"]

# Coordination API group - for leader election if needed
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Metrics API group - for resource metrics
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: enhanced-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: enhanced-scheduler
subjects:
- kind: ServiceAccount
  name: enhanced-scheduler
  namespace: scheduler-system