apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enhanced-scheduler-netpol
  namespace: scheduler-system
spec:
  podSelector:
    matchLabels:
      app: enhanced-scheduler
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from: []  # Allow all ingress for metrics
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - {}